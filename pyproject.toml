[project]
name = "resultstex"
version = "0.1.0"
description = "Keep every number in a LaTeX paper generated from code"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Samuel Justus Schwertfeger", email = "113480134+SamuelSchwertfeger@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = ["LaTeX", "reproducibility", "papers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Repository = "https://github.com/SamuelSchwertfeger/resultstex"
Issues = "https://github.com/SamuelSchwertfeger/resultstex/issues"

[project.scripts]
resultstex = "resultstex:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
# Values are arbitrary by design (any JSON-serialisable result), so Any is expected.
reportAny = false
reportExplicitAny = false
# Style-only rules: write_text()/add_argument() return values are never needed, and adjacent string literals are used for multi-line test data.
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
